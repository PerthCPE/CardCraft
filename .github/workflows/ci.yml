name: CardCraft CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend (NestJS + Prisma + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://cardcraft:cardcraft_password@localhost:5432/cardcraft_db?schema=public
        run: npx prisma generate

      - name: Run Linter / Typecheck
        run: npm run lint

      - name: Run Jest Unit Tests
        run: npm test -- --ci --coverage

      - name: Build NestJS Production Bundle
        run: npm run build

  frontend-ci:
    name: Frontend (Next.js App Router + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Typecheck
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm test -- --ci

      - name: Build Next.js App
        run: npm run build
