<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" fill="#F8F5EC"/>
  <rect x="16" y="16" width="608" height="328" fill="#F1F5F9" stroke="#0F172A" stroke-width="6"/>
  <!-- Boardroom Floor -->
  <rect x="22" y="270" width="596" height="68" fill="#CBD5E1" stroke="#0F172A" stroke-width="4"/>

  <!-- Projected Screen with Line Graph (Center/Left) -->
  <rect x="70" y="45" width="260" height="150" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
  <!-- Projection Stand -->
  <line x1="200" y1="195" x2="200" y2="270" stroke="#0F172A" stroke-width="6"/>
  <line x1="160" y1="270" x2="240" y2="270" stroke="#0F172A" stroke-width="6"/>
  <!-- Grid lines on screen -->
  <line x1="90" y1="160" x2="310" y2="160" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="90" y1="120" x2="310" y2="120" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="90" y1="80" x2="310" y2="80" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Line Graph Line (Rising Trend) -->
  <polyline points="100,150 140,135 180,140 220,105 260,95 300,65" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="150" r="4" fill="#1D4ED8"/>
  <circle cx="140" cy="135" r="4" fill="#1D4ED8"/>
  <circle cx="180" cy="140" r="4" fill="#1D4ED8"/>
  <circle cx="220" cy="105" r="4" fill="#1D4ED8"/>
  <circle cx="260" cy="95" r="4" fill="#1D4ED8"/>
  <circle cx="300" cy="65" r="4" fill="#10B981"/>

  <!-- Speaker / Presenter Standing (Center Right) -->
  <circle cx="370" cy="120" r="14" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
  <!-- Business Suit Torso -->
  <rect x="356" y="134" width="28" height="52" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <polygon points="366,134 374,134 370,155" fill="#EF4444"/>
  <!-- Arm pointing toward screen -->
  <line x1="360" y1="145" x2="310" y2="110" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="358" y="186" width="10" height="84" fill="#334155" stroke="#0F172A" stroke-width="3"/>
  <rect x="372" y="186" width="10" height="84" fill="#334155" stroke="#0F172A" stroke-width="3"/>

  <!-- Boardroom Table & Audience Silhouette (Far Right) -->
  <ellipse cx="530" cy="250" rx="80" ry="25" fill="#92400E" stroke="#0F172A" stroke-width="4"/>
  <circle cx="500" cy="190" r="12" fill="#475569" stroke="#0F172A" stroke-width="2"/>
  <circle cx="550" cy="190" r="12" fill="#475569" stroke="#0F172A" stroke-width="2"/>
</svg>
