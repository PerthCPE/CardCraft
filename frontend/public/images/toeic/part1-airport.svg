<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" fill="#F8F5EC"/>
  <rect x="16" y="16" width="608" height="328" fill="#F1F5F9" stroke="#0F172A" stroke-width="6"/>
  <!-- Terminal Floor -->
  <rect x="22" y="270" width="596" height="68" fill="#E2E8F0" stroke="#0F172A" stroke-width="4"/>

  <!-- Flight Information Display Screen (Top Left) -->
  <rect x="50" y="40" width="160" height="70" fill="#0F172A" stroke="#0284C7" stroke-width="3"/>
  <rect x="60" y="52" width="140" height="10" fill="#38BDF8"/>
  <rect x="60" y="68" width="100" height="8" fill="#FBBF24"/>
  <rect x="60" y="82" width="120" height="8" fill="#34D399"/>

  <!-- Airline Check-in Counter (Right) -->
  <rect x="380" y="170" width="210" height="100" fill="#0284C7" stroke="#0F172A" stroke-width="4"/>
  <rect x="400" y="130" width="40" height="40" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
  <circle cx="500" cy="140" r="14" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
  <!-- Airline Agent Behind Counter -->
  <rect x="488" y="154" width="24" height="20" fill="#0369A1" stroke="#0F172A" stroke-width="2"/>

  <!-- Passengers in Queue (Left to Center) -->
  <!-- Passenger 1 (Closest to Counter) -->
  <circle cx="330" cy="150" r="14" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
  <rect x="318" y="164" width="24" height="50" fill="#475569" stroke="#0F172A" stroke-width="3"/>
  <rect x="320" y="214" width="10" height="56" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <!-- Luggage Suitcase -->
  <rect x="348" y="220" width="22" height="48" fill="#DC2626" stroke="#0F172A" stroke-width="3"/>
  <rect x="354" y="206" width="10" height="14" fill="none" stroke="#0F172A" stroke-width="3"/>

  <!-- Passenger 2 (Behind in line) -->
  <circle cx="250" cy="152" r="14" fill="#FDBA74" stroke="#0F172A" stroke-width="3"/>
  <rect x="238" y="166" width="24" height="48" fill="#059669" stroke="#0F172A" stroke-width="3"/>
  <rect x="240" y="214" width="10" height="56" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <!-- Rolling Bag -->
  <rect x="215" y="225" width="20" height="42" fill="#2563EB" stroke="#0F172A" stroke-width="3"/>

  <!-- Passenger 3 (Third in line) -->
  <circle cx="170" cy="154" r="14" fill="#FED7AA" stroke="#0F172A" stroke-width="3"/>
  <rect x="158" y="168" width="24" height="48" fill="#D97706" stroke="#0F172A" stroke-width="3"/>
  <rect x="160" y="216" width="10" height="54" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
</svg>
